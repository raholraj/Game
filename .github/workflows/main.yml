name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1.5. Unzip ZIP File & Auto-Fix Path ───────────────────────────────────
      - name: Unzip and Fix Project Path
        run: |
          unzip -o GameGuardian.zip
          rm GameGuardian.zip
          
          # Find the exact folder containing the Gradle project
          DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
          if [ "$DIR" != "." ] && [ ! -z "$DIR" ]; then
            echo "Gradle project found in $DIR. Copying files to root..."
            rsync -a "$DIR"/ ./
          else
            echo "Already in root directory or no Gradle project found."
          fi

      # ── 1.6. Fix AndroidX Issue (नई सेटिंग जोड़ी गई) ───────────────────────────
      - name: Fix gradle.properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      # ── 2. Java 17 setup ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache (speeds up 2nd+ builds to ~3 min) ────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Install Gradle & generate wrapper (no .jar in repo needed) ─────────
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.4 --distribution-type=bin
          chmod +x gradlew

      # ── 5. Build debug APK ───────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 6. Upload APK as artifact (available for 7 days) ─────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameGuardian-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
